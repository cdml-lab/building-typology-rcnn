# Versions used for the study and for the verification run.
# PyTorch: install the build for your platform first, e.g.
#   CPU:  pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
#   CUDA: pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu118
name: building-typology
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy=2.2
  - pandas=2.3
  - geopandas=1.1
  - shapely=2.1
  - pyogrio
  - rasterio=1.4
  - pillow
  - scikit-learn=1.7
  - pip
  - pip:
      - -e .
