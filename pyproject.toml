[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-typology-rcnn"
version = "1.0.0"
description = "Building-form detection and classification from aerial orthophotos (Faster R-CNN, ResNet-101 FPN) and assignment to building footprints"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Author removed for anonymity; will be added after the article is accepted"}]
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "pandas>=2.0",
  "geopandas>=0.14", "shapely>=2.0", "pyogrio>=0.7", "rasterio>=1.3",
  "pillow>=10", "scikit-learn>=1.3",
]
[project.optional-dependencies]
test = ["pytest>=7"]
[project.scripts]
buildingtypology = "buildingtypology.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
